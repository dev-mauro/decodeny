name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Versión de Ubuntu fija (no `ubuntu-latest`): los E2E dependen del WebGL por software del
# runner y un cambio de imagen no debe romperlos sin aviso. Se actualiza a propósito.
jobs:
  check:
    name: Lint, tipos y tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcruise
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm size

  cloud:
    name: Reglas de Firestore y limpieza (emulador)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # El emulador de Firestore necesita Java 21 o superior.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:cloud

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm --filter @decodeny/web exec playwright install --with-deps chromium
      # Primero todo sin nube (los emuladores de Firebase compiten por la CPU con el WebGL por
      # software); después, los de la nube con los emuladores (proyecto demo, sin red real).
      - run: pnpm e2e
      - name: E2E de la nube (emuladores)
        run: node scripts/cloud/with-emulators.mjs pnpm e2e cloud.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
